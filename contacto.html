<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DeCastro Sports</title>
</head>
<body>
    <h1>Contacta con nosotros</h1>
    <p>Resolvemos dudas sobre inscripciones, categorías y horarios.</p>

    <form action="ws/createElement.php" method="post">
        <p>
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </p>
        <p>
            <label for="email">Correo electrónico</label><br>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
        </p>
        <p>
            <label for="mensaje">Mensaje</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe tu consulta" required></textarea>
        </p>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
